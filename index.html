<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Campaign Lens｜营销内容风险审阅</title><link rel="stylesheet" href="style.css"></head>
<body><main><header><div class="brand"><span class="mark">CL</span><span>CAMPAIGN LENS <small>实验性工具 / 01</small></span></div><a href="https://github.com/JostarPlatinum-DMY" target="_blank" rel="noopener noreferrer">GitHub ↗</a></header><section class="hero"><p class="eyebrow">MARKETING × LAW × AI</p><h1>让每一句营销文案<br><em>经得起追问。</em></h1><p class="intro">在内容发布前，快速找出值得人工核查的表述。每条提示都附带原因、核查问题和修改方向。</p><div class="note">本工具在浏览器本地运行。规则命中并不代表违法；没有命中也不代表合规。</div></section><section class="workspace"><div class="panel editor"><div class="section-head"><div><span class="step">01 / INPUT</span><h2>待审阅文案</h2></div><span id="count">0 字 · 0 处待核查</span></div><textarea id="copy" aria-label="待审阅文案" placeholder="把营销文案粘贴在这里……"></textarea><div class="samples"><span>试试示例</span><button data-sample="gdpr">GDPR 科普</button><button data-sample="ecommerce">电商宣传</button><button data-sample="gaming">游戏促销</button></div><div class="actions"><button id="analyze" class="primary">开始审阅 <span>↗</span></button><button id="clear" class="quiet">清空</button></div></div><div class="panel review"><div class="section-head"><div><span class="step">02 / REVIEW</span><h2>审阅线索</h2></div><button id="copy-report" class="copy">复制审阅清单 ↗</button></div><div id="results" aria-live="polite"></div></div></section><footer><span>Campaign Lens · 开源作品集原型</span><span>规则透明 · 人工判断 · 本地处理</span></footer></main><script type="module" src="app.js"></script></body></html>
